project:
  type: default
  render:
    - "*.qmd"

author: "Damien Dupré"

# Lectures 6 to 9 run their Python when they render: each sets
# `jupyter: python3` in its own header, so the other decks start no kernel.
# Code shown for reading uses ```{.python}, which needs no kernel.

filters:
  - timer

format:
  revealjs:
    theme: [theme/metropolis.scss, styles.scss]
    toc-depth: 1
    chalkboard: false
    menu: true
    slide-number: true
    preview-links: auto

title-slide-attributes:
    data-background-iframe: colored-particles/index.html

preload-iframes: true

execute:
  echo: true
  warning: false
